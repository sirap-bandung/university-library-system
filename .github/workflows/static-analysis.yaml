name: Static Analysis
on:
  pull_request: ~
permissions:
  contents: read
jobs:
  psalm:
    name: Psalm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Psalm
        uses: docker://ghcr.io/psalm/psalm-github-action

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    env:
      php-version: '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Composer
        uses: php-actions/composer@v6

      - name: PHPStan Static Analysis
        uses: php-actions/phpstan@v3
        with:
          path: src/
